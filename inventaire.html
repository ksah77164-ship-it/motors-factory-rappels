<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventaire">
<title>Inventaire — Motors Factory</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --accent:#6366f1; --accent2:#8b5cf6; --ok:#16a34a; --danger:#dc2626; --soft:#eef2ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);}
body{font-family:'Nunito',sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;
  padding:14px 14px calc(96px + env(safe-area-inset-bottom));}
.app{max-width:720px;margin:0 auto;}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;}
input{font-family:inherit;}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.logo{display:flex;align-items:center;gap:10px;min-width:0;}
.logo-icon{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.logo-text{font-size:18px;font-weight:900;line-height:1.1;}
.logo-sub{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.btn-menu{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:13px;font-weight:800;color:var(--ink);}

/* Totaux */
.totaux{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:18px;padding:14px;margin-bottom:12px;}
.totaux-haut{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.totaux-haut .gros{font-size:28px;font-weight:900;}
.totaux-haut .petit{font-size:12px;font-weight:700;opacity:.85;}
.grille-tailles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.grille-tailles div{background:rgba(255,255,255,.16);border-radius:10px;text-align:center;padding:6px 0;}
.grille-tailles b{display:block;font-size:16px;font-weight:900;}
.grille-tailles span{font-size:10.5px;font-weight:800;opacity:.9;}

.recherche{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;font-size:15px;margin-bottom:12px;outline:none;}
.recherche:focus{border-color:var(--accent);}

/* Cartes pièce */
.piece{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;}
.piece-haut{display:flex;gap:12px;align-items:center;margin-bottom:10px;}
.vignette{width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--soft);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:26px;border:none;padding:0;overflow:hidden;}
.vignette img{width:100%;height:100%;object-fit:cover;display:block;}
.piece-info{flex:1;min-width:0;}
.piece-nom{font-size:15.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.piece-ref{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.piece-total{font-size:12.5px;font-weight:800;color:var(--accent);margin-top:2px;}
.btn-edit{background:var(--soft);border:none;border-radius:10px;width:38px;height:38px;font-size:16px;flex-shrink:0;}

.compteurs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.cpt{border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:space-between;padding:3px;}
.cpt.plein{border-color:#c7d2fe;background:#f5f7ff;}
.cpt button{width:34px;height:34px;border:none;border-radius:9px;background:var(--soft);font-size:18px;font-weight:900;color:var(--accent);}
.cpt .mid{text-align:center;line-height:1.05;flex:1;}
.cpt .t{font-size:10.5px;font-weight:900;color:var(--muted);}
.cpt .n{font-size:17px;font-weight:900;border:none;background:none;width:100%;text-align:center;color:var(--ink);padding:0;}
.cpt .n:focus{outline:none;color:var(--accent);}
.cpt .n::-webkit-inner-spin-button,.cpt .n::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.cpt .n{-moz-appearance:textfield;appearance:textfield;}

.vide{text-align:center;color:var(--muted);font-weight:700;padding:40px 16px;line-height:1.6;}
.vide .ico{font-size:44px;margin-bottom:6px;}

/* Bouton principal flottant */
.barre-bas{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,rgba(243,244,246,0));}
.barre-bas .inner{max-width:720px;margin:0 auto;display:flex;gap:8px;}
.btn-princ{flex:1;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:14px;
  padding:15px;font-size:16px;font-weight:900;box-shadow:0 8px 24px rgba(99,102,241,.35);}
.btn-sec{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:15px 16px;font-size:15px;font-weight:900;}

/* Fenêtres */
.voile{position:fixed;inset:0;background:rgba(17,24,39,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;}
.voile.on{display:flex;}
.fenetre{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:92vh;overflow-y:auto;}
.fenetre h3{font-size:17px;font-weight:900;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.fermer{background:var(--soft);border:none;border-radius:10px;width:34px;height:34px;font-size:16px;}
.zone-photo{width:100%;aspect-ratio:4/3;border-radius:16px;border:2px dashed #c7d2fe;background:var(--soft);display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--accent);font-weight:900;font-size:15px;
  margin-bottom:12px;overflow:hidden;position:relative;}
.zone-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#111;}
.zone-photo .gros{font-size:38px;}
.photo-btns{display:flex;gap:8px;margin-bottom:12px;}
.photo-btns label{flex:1;text-align:center;background:var(--soft);color:var(--accent);border-radius:12px;padding:11px;font-weight:900;font-size:14px;cursor:pointer;}
label.lbl{display:block;font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.champ{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;margin-bottom:12px;outline:none;}
.champ:focus{border-color:var(--accent);}
.fenetre .compteurs{margin-bottom:14px;}
.fenetre .cpt button{width:40px;height:40px;}
.ligne-btns{display:flex;gap:8px;}
.ligne-btns .btn-princ{box-shadow:none;}
.btn-suppr{background:#fee2e2;color:var(--danger);border:none;border-radius:14px;padding:15px 16px;font-size:15px;font-weight:900;}

.menu-liste button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;
  border-bottom:1px solid var(--line);padding:14px 4px;font-size:15px;font-weight:800;color:var(--ink);}
.menu-liste button:last-child{border-bottom:none;}
.menu-liste small{display:block;font-size:12px;color:var(--muted);font-weight:600;}
.menu-liste .ico{font-size:22px;width:30px;text-align:center;}

.grande-photo{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:60;}
.grande-photo.on{display:flex;}
.grande-photo img{max-width:100%;max-height:100%;}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:800;opacity:0;
  transition:all .25s;z-index:70;pointer-events:none;max-width:90vw;text-align:center;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon">👕</div>
      <div>
        <div class="logo-text">Inventaire</div>
        <div class="logo-sub">Motors Factory</div>
      </div>
    </div>
    <button class="btn-menu" onclick="ouvrir('menu')">☰ Menu</button>
  </div>

  <div class="totaux">
    <div class="totaux-haut">
      <div><div class="gros" id="tot-general">0</div><div class="petit">pièces en tout</div></div>
      <div class="petit" id="tot-modeles">0 modèle</div>
    </div>
    <div class="grille-tailles" id="tot-tailles"></div>
  </div>

  <input class="recherche" id="recherche" type="search" placeholder="🔍 Chercher une pièce…" oninput="afficher()">
  <div id="liste"></div>
</div>

<div class="barre-bas"><div class="inner">
  <button class="btn-princ" onclick="nouvellePiece()">📷 Ajouter une pièce</button>
  <button class="btn-sec" onclick="envoyer()" title="Envoyer l'inventaire">📤</button>
</div></div>

<!-- Fiche pièce -->
<div class="voile" id="fiche" onclick="if(event.target===this)fermer('fiche')">
  <div class="fenetre">
    <h3><span id="fiche-titre">Nouvelle pièce</span><button class="fermer" onclick="fermer('fiche')">✕</button></h3>
    <div class="zone-photo" id="zone-photo" onclick="document.getElementById('in-camera').click()">
      <div class="gros">📷</div><div>Prendre la photo</div>
    </div>
    <div class="photo-btns">
      <label>📷 Appareil<input id="in-camera" type="file" accept="image/*" capture="environment" hidden onchange="chargerPhoto(this)"></label>
      <label>🖼️ Galerie<input id="in-galerie" type="file" accept="image/*" hidden onchange="chargerPhoto(this)"></label>
    </div>
    <label class="lbl" for="f-nom">Nom de la pièce</label>
    <input class="champ" id="f-nom" placeholder="Ex : Sweat noir logo brodé">
    <label class="lbl" for="f-ref">Référence / couleur (facultatif)</label>
    <input class="champ" id="f-ref" placeholder="Ex : SW-001 · Noir">
    <label class="lbl">Quantité par taille</label>
    <div class="compteurs" id="f-compteurs"></div>
    <div class="ligne-btns">
      <button class="btn-suppr" id="btn-suppr" onclick="supprimer()">🗑️</button>
      <button class="btn-princ" onclick="enregistrer()">✔ Enregistrer</button>
    </div>
  </div>
</div>

<!-- Menu -->
<div class="voile" id="menu" onclick="if(event.target===this)fermer('menu')">
  <div class="fenetre">
    <h3>Menu<button class="fermer" onclick="fermer('menu')">✕</button></h3>
    <div class="menu-liste">
      <button onclick="fermer('menu');envoyer()"><span class="ico">📤</span><span>Envoyer l'inventaire<small>Une page avec les photos et les tailles, à envoyer par WhatsApp, mail…</small></span></button>
      <button onclick="fermer('menu');exporterCSV()"><span class="ico">📊</span><span>Tableau Excel (CSV)<small>Une ligne par pièce, une colonne par taille</small></span></button>
      <button onclick="fermer('menu');sauvegarder()"><span class="ico">💾</span><span>Sauvegarde complète<small>Fichier à garder, ou à rouvrir sur un autre téléphone</small></span></button>
      <button onclick="fermer('menu');document.getElementById('in-import').click()"><span class="ico">📥</span><span>Ouvrir une sauvegarde<small>Ajoute les pièces sans rien effacer</small></span></button>
      <button onclick="fermer('menu');toutRemettreAZero()"><span class="ico">🔄</span><span>Remettre les quantités à zéro<small>Garde les pièces et les photos, pour un nouvel inventaire</small></span></button>
      <button onclick="fermer('menu');toutEffacer()" style="color:var(--danger)"><span class="ico">🗑️</span><span>Tout effacer<small>Supprime toutes les pièces de ce téléphone</small></span></button>
    </div>
    <input id="in-import" type="file" accept=".json,application/json" hidden onchange="importer(this)">
  </div>
</div>

<div class="grande-photo" id="grande-photo" onclick="this.classList.remove('on')"><img alt=""></div>
<div class="toast" id="toast"></div>

<script>
const TAILLES=["XS","S","M","L","XL","XXL"];
let pieces=[];          // {id,nom,ref,qte:{XS:0,…},photo:dataURL,maj}
let enCours=null;       // pièce ouverte dans la fiche (copie)

/* ---------- Stockage (IndexedDB : les photos ne tiennent pas dans localStorage) ---------- */
let db=null;
function ouvrirBase(){
  return new Promise((ok,ko)=>{
    const r=indexedDB.open("mf-inventaire",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("pieces",{keyPath:"id"});
    r.onsuccess=()=>{db=r.result;ok();};
    r.onerror=()=>ko(r.error);
  });
}
function tx(mode){return db.transaction("pieces",mode).objectStore("pieces");}
function toutLire(){return new Promise((ok,ko)=>{const r=tx("readonly").getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ko(r.error);});}
function ecrire(p){return new Promise((ok,ko)=>{const r=tx("readwrite").put(p);r.onsuccess=ok;r.onerror=()=>ko(r.error);});}
function effacer(id){return new Promise((ok,ko)=>{const r=tx("readwrite").delete(id);r.onsuccess=ok;r.onerror=()=>ko(r.error);});}

/* ---------- Utilitaires ---------- */
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function qteVide(){const q={};TAILLES.forEach(t=>q[t]=0);return q;}
function total(p){return TAILLES.reduce((s,t)=>s+(+p.qte[t]||0),0);}
function nomPiece(p,i){return p.nom||("Pièce "+(i+1));}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2200);}
function ouvrir(id){$(id).classList.add("on");}
function fermer(id){$(id).classList.remove("on");}
function dateFichier(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function trier(){pieces.sort((a,b)=>(a.cree||0)-(b.cree||0));}

/* ---------- Affichage ---------- */
function compteursHTML(p,dansFiche){
  return TAILLES.map(t=>{
    const n=+p.qte[t]||0;
    const ref=dansFiche?`'fiche'`:`'${p.id}'`;
    return `<div class="cpt${n?" plein":""}">
      <button onclick="changer(${ref},'${t}',-1)" aria-label="moins ${t}">−</button>
      <div class="mid"><div class="t">${t}</div>
        <input class="n" type="number" inputmode="numeric" min="0" value="${n}" onfocus="this.select()" onchange="fixer(${ref},'${t}',this.value)"></div>
      <button onclick="changer(${ref},'${t}',1)" aria-label="plus ${t}">+</button>
    </div>`;
  }).join("");
}
function afficher(){
  const tot=qteVide();
  pieces.forEach(p=>TAILLES.forEach(t=>tot[t]+=(+p.qte[t]||0)));
  const general=TAILLES.reduce((s,t)=>s+tot[t],0);
  $("tot-general").textContent=general;
  $("tot-modeles").textContent=pieces.length+(pieces.length>1?" modèles":" modèle");
  $("tot-tailles").innerHTML=TAILLES.map(t=>`<div><b>${tot[t]}</b><span>${t}</span></div>`).join("");

  const q=$("recherche").value.trim().toLowerCase();
  const liste=pieces.map((p,i)=>({p,i})).filter(({p})=>!q||(p.nom+" "+p.ref).toLowerCase().includes(q));
  if(!pieces.length){
    $("liste").innerHTML=`<div class="vide"><div class="ico">👕</div>Aucune pièce pour l'instant.<br>Appuie sur <b>« Ajouter une pièce »</b>,<br>prends la photo, puis indique les quantités de XS à XXL.</div>`;
    return;
  }
  if(!liste.length){$("liste").innerHTML=`<div class="vide">Aucune pièce ne correspond.</div>`;return;}
  $("liste").innerHTML=liste.map(({p,i})=>`
    <div class="piece">
      <div class="piece-haut">
        <button class="vignette" onclick="voirPhoto('${p.id}')">${p.photo?`<img src="${p.photo}" alt="">`:"👕"}</button>
        <div class="piece-info">
          <div class="piece-nom">${esc(nomPiece(p,i))}</div>
          ${p.ref?`<div class="piece-ref">${esc(p.ref)}</div>`:""}
          <div class="piece-total">${total(p)} pièce${total(p)>1?"s":""}</div>
        </div>
        <button class="btn-edit" onclick="modifierPiece('${p.id}')" aria-label="Modifier">✏️</button>
      </div>
      <div class="compteurs">${compteursHTML(p,false)}</div>
    </div>`).join("");
}
function voirPhoto(id){
  const p=pieces.find(x=>x.id===id);
  if(!p||!p.photo){modifierPiece(id);return;}
  $("grande-photo").querySelector("img").src=p.photo;
  $("grande-photo").classList.add("on");
}

/* ---------- Compteurs ---------- */
function cible(ref){return ref==="fiche"?enCours:pieces.find(x=>x.id===ref);}
async function majCompteur(ref,t,val){
  const p=cible(ref);if(!p)return;
  p.qte[t]=Math.max(0,Math.floor(+val||0));
  if(ref==="fiche"){$("f-compteurs").innerHTML=compteursHTML(enCours,true);return;}
  p.maj=Date.now();
  await ecrire(p);
  afficher();
}
function changer(ref,t,d){const p=cible(ref);if(p)majCompteur(ref,t,(+p.qte[t]||0)+d);}
function fixer(ref,t,v){majCompteur(ref,t,v);}

/* ---------- Fiche ---------- */
function remplirFiche(){
  $("f-nom").value=enCours.nom||"";
  $("f-ref").value=enCours.ref||"";
  $("f-compteurs").innerHTML=compteursHTML(enCours,true);
  montrerPhoto();
}
function montrerPhoto(){
  $("zone-photo").innerHTML=enCours.photo?`<img src="${enCours.photo}" alt="">`:`<div class="gros">📷</div><div>Prendre la photo</div>`;
}
function nouvellePiece(){
  enCours={id:"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),nom:"",ref:"",qte:qteVide(),photo:"",cree:Date.now()};
  $("fiche-titre").textContent="Nouvelle pièce";
  $("btn-suppr").style.display="none";
  remplirFiche();ouvrir("fiche");
  // Sur téléphone, on ouvre directement l'appareil photo.
  if(matchMedia("(pointer:coarse)").matches)setTimeout(()=>$("in-camera").click(),250);
}
function modifierPiece(id){
  const p=pieces.find(x=>x.id===id);if(!p)return;
  enCours=JSON.parse(JSON.stringify(p));
  $("fiche-titre").textContent="Modifier la pièce";
  $("btn-suppr").style.display="";
  remplirFiche();ouvrir("fiche");
}
function chargerPhoto(input){
  const f=input.files&&input.files[0];input.value="";
  if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{
    // Photo réduite : assez nette pour reconnaître la pièce, assez légère pour en stocker des centaines.
    const max=900,r=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    enCours.photo=c.toDataURL("image/jpeg",0.78);
    URL.revokeObjectURL(url);montrerPhoto();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);toast("Photo illisible");};
  img.src=url;
}
async function enregistrer(){
  enCours.nom=$("f-nom").value.trim();
  enCours.ref=$("f-ref").value.trim();
  enCours.maj=Date.now();
  await ecrire(enCours);
  const i=pieces.findIndex(x=>x.id===enCours.id);
  if(i>=0)pieces[i]=enCours;else pieces.push(enCours);
  fermer("fiche");afficher();toast("Pièce enregistrée ✔");
}
async function supprimer(){
  if(!confirm("Supprimer cette pièce ?"))return;
  await effacer(enCours.id);
  pieces=pieces.filter(x=>x.id!==enCours.id);
  fermer("fiche");afficher();toast("Pièce supprimée");
}

/* ---------- Export / envoi ---------- */
function fichier(contenu,nom,type){return new File([contenu],nom,{type});}
function telecharger(f){
  const url=URL.createObjectURL(f),a=document.createElement("a");
  a.href=url;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
async function partagerOuTelecharger(f,titre){
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:titre});return;}
    catch(e){if(e.name==="AbortError")return;}
  }
  telecharger(f);toast("Fichier « "+f.name+" » téléchargé");
}
function rapportHTML(){
  const tot=qteVide();pieces.forEach(p=>TAILLES.forEach(t=>tot[t]+=(+p.qte[t]||0)));
  const general=TAILLES.reduce((s,t)=>s+tot[t],0);
  const d=new Date().toLocaleString("fr-FR");
  const lignes=pieces.map((p,i)=>`<tr>
    <td class="ph">${p.photo?`<img src="${p.photo}">`:""}</td>
    <td><b>${esc(nomPiece(p,i))}</b>${p.ref?`<br><small>${esc(p.ref)}</small>`:""}</td>
    ${TAILLES.map(t=>`<td class="n${+p.qte[t]?"":" z"}">${+p.qte[t]||0}</td>`).join("")}
    <td class="n tot">${total(p)}</td></tr>`).join("");
  return `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventaire Motors Factory — ${dateFichier()}</title>
<style>body{font-family:system-ui,sans-serif;margin:16px;color:#111}h1{font-size:20px;margin:0 0 4px}p{color:#666;margin:0 0 14px;font-size:13px}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #e5e7eb;padding:6px;text-align:left;vertical-align:middle}
th{background:#eef2ff;font-size:12px}td.n,th.n{text-align:center;width:42px}td.z{color:#bbb}td.tot{font-weight:800;background:#f5f7ff}
td.ph{width:76px;padding:3px}td.ph img{width:70px;height:70px;object-fit:cover;border-radius:8px;display:block}
small{color:#666}tfoot td{font-weight:800;background:#eef2ff}</style></head><body>
<h1>Inventaire Motors Factory</h1><p>${d} · ${pieces.length} modèle(s) · <b>${general} pièce(s)</b></p>
<div class="wrap"><table><thead><tr><th>Photo</th><th>Pièce</th>${TAILLES.map(t=>`<th class="n">${t}</th>`).join("")}<th class="n">Total</th></tr></thead>
<tbody>${lignes}</tbody><tfoot><tr><td></td><td>TOTAL</td>${TAILLES.map(t=>`<td class="n">${tot[t]}</td>`).join("")}<td class="n">${general}</td></tr></tfoot></table></div>
</body></html>`;
}
function envoyer(){
  if(!pieces.length){toast("Aucune pièce à envoyer");return;}
  partagerOuTelecharger(fichier(rapportHTML(),"inventaire-"+dateFichier()+".html","text/html"),"Inventaire Motors Factory");
}
function exporterCSV(){
  if(!pieces.length){toast("Aucune pièce à exporter");return;}
  const c=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const lignes=[["Pièce","Référence",...TAILLES,"Total"].map(c).join(";")];
  pieces.forEach((p,i)=>lignes.push([c(nomPiece(p,i)),c(p.ref),...TAILLES.map(t=>+p.qte[t]||0),total(p)].join(";")));
  partagerOuTelecharger(fichier("﻿"+lignes.join("\r\n"),"inventaire-"+dateFichier()+".csv","text/csv"),"Inventaire (CSV)");
}
function sauvegarder(){
  if(!pieces.length){toast("Rien à sauvegarder");return;}
  const data=JSON.stringify({app:"mf-inventaire",version:1,date:new Date().toISOString(),pieces});
  partagerOuTelecharger(fichier(data,"inventaire-sauvegarde-"+dateFichier()+".json","application/json"),"Sauvegarde inventaire");
}
async function importer(input){
  const f=input.files&&input.files[0];input.value="";
  if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    const liste=Array.isArray(data)?data:data.pieces;
    if(!Array.isArray(liste))throw new Error();
    let ajout=0,maj=0;
    for(const src of liste){
      if(!src||!src.id)continue;
      const p={id:String(src.id),nom:String(src.nom||""),ref:String(src.ref||""),photo:typeof src.photo==="string"&&src.photo.startsWith("data:image/")?src.photo:"",
        qte:qteVide(),cree:+src.cree||Date.now(),maj:+src.maj||Date.now()};
      TAILLES.forEach(t=>p.qte[t]=Math.max(0,Math.floor(+(src.qte&&src.qte[t])||0)));
      const i=pieces.findIndex(x=>x.id===p.id);
      if(i<0){pieces.push(p);ajout++;await ecrire(p);}
      else if((p.maj||0)>(pieces[i].maj||0)){pieces[i]=p;maj++;await ecrire(p);}
    }
    trier();afficher();
    toast(ajout+" ajoutée(s), "+maj+" mise(s) à jour");
  }catch(e){toast("Ce fichier n'est pas une sauvegarde d'inventaire");}
}
async function toutRemettreAZero(){
  if(!pieces.length||!confirm("Remettre toutes les quantités à zéro ?\nLes pièces et les photos sont gardées."))return;
  for(const p of pieces){p.qte=qteVide();p.maj=Date.now();await ecrire(p);}
  afficher();toast("Quantités remises à zéro");
}
async function toutEffacer(){
  if(!pieces.length||!confirm("Effacer TOUTES les pièces de ce téléphone ?\nPensez à faire une sauvegarde avant."))return;
  for(const p of pieces)await effacer(p.id);
  pieces=[];afficher();toast("Inventaire effacé");
}

/* ---------- Démarrage ---------- */
(async()=>{
  try{await ouvrirBase();pieces=await toutLire();trier();}
  catch(e){toast("Stockage indisponible sur ce navigateur");}
  afficher();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
})();
</script>
</body>
</html>
