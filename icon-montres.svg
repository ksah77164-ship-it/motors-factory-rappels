<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#C9A15A"/>
      <stop offset="52%" stop-color="#E8CD97"/>
      <stop offset="100%" stop-color="#B98F4A"/>
    </linearGradient>
    <linearGradient id="sombre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2A2114"/>
      <stop offset="100%" stop-color="#12100B"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#or)"/>

  <!-- bracelet -->
  <rect x="196" y="52"  width="120" height="110" rx="26" fill="url(#sombre)"/>
  <rect x="196" y="350" width="120" height="110" rx="26" fill="url(#sombre)"/>

  <!-- boutons latéraux -->
  <rect x="118" y="212" width="26" height="34" rx="9" fill="url(#sombre)"/>
  <rect x="118" y="270" width="26" height="34" rx="9" fill="url(#sombre)"/>
  <rect x="368" y="212" width="26" height="34" rx="9" fill="url(#sombre)"/>
  <rect x="368" y="270" width="26" height="34" rx="9" fill="url(#sombre)"/>

  <!-- boîtier -->
  <rect x="134" y="134" width="244" height="244" rx="54" fill="url(#sombre)"/>

  <!-- écran -->
  <rect x="168" y="190" width="176" height="118" rx="22" fill="#E8CD97"/>

  <!-- affichage : 4 chiffres separes par deux points -->
  <g fill="#12100B">
    <rect x="180" y="214" width="26" height="70" rx="7"/>
    <rect x="214" y="214" width="26" height="70" rx="7"/>
    <rect x="250" y="230" width="12" height="12" rx="4"/>
    <rect x="250" y="256" width="12" height="12" rx="4"/>
    <rect x="272" y="214" width="26" height="70" rx="7"/>
    <rect x="306" y="214" width="26" height="70" rx="7"/>
  </g>
</svg>
